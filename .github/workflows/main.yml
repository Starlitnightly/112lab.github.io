name: Build and Deploy
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  GATSBY_EMAILJS_SERVICE_ID: ${{ secrets.GATSBY_EMAILJS_SERVICE_ID }}
  GATSBY_EMAILJS_TEMPLATE_ID: ${{ secrets.GATSBY_EMAILJS_TEMPLATE_ID }}
  GATSBY_EMAILJS_USER_ID: ${{ secrets.GATSBY_EMAILJS_USER_ID }}

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Use Node.js v14
        uses: actions/setup-node@v4
        with:
          node-version: "14.x"

      - name: Install 🔧
        run: npx npm@6 ci

      # Unprefixed build -> Cloudflare Pages (https://112lab.asia/)
      - name: Build (root, for Cloudflare) 🔧
        run: |
          npx npm@6 run build
          mv public site-root

      # Prefixed build -> GitHub Pages project site (/112lab.github.io/)
      - name: Build (prefixed, for GitHub Pages) 🔧
        run: npx npm@6 run build:gh-pages

      - name: Upload Cloudflare artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-root
          path: site-root
          retention-days: 3

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-github-pages:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || '112lab' }}
    steps:
      - name: Check Cloudflare credentials
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping Cloudflare Pages deploy"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download site
        if: steps.cf.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site-root
          path: site-root

      - name: Deploy to Cloudflare Pages 🚀
        if: steps.cf.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site-root --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true

  deploy-netlify:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Check Netlify credentials
        id: nf
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID not set; skipping Netlify deploy"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download site
        if: steps.nf.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site-root
          path: site-root

      - name: Use Node.js v20
        if: steps.nf.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Deploy to Netlify (112lab.netlify.app) 🚀
        if: steps.nf.outputs.enabled == 'true'
        run: npx --yes netlify-cli@17 deploy --prod --dir=site-root --site="$NETLIFY_SITE_ID" --message "GitHub Actions ${GITHUB_SHA::7}"
